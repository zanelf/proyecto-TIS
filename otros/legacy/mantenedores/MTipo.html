<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Solicitud - Sistema Municipal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 fw-bold mb-0">Mantenedores</h1>
        <div class="d-flex align-items-center">
            <div class="text-end me-2 d-none d-md-block">
                <p class="mb-0 fw-bold small">Administrador Municipal</p>
                <p class="mb-0 text-secondary small">Panel de Control</p>
            </div>
            <img src="https://ui-avatars.com/api/?name=Admin+Muni&background=0d6efd&color=fff" class="rounded-circle" width="40">
        </div>
    </div>

    <ul class="nav nav-pills mb-5">
        <li class="nav-item"><a class="nav-link" href="MDepartamento.html"><i class="fa-solid fa-building"></i> Departamentos</a></li>
        <li class="nav-item"><a class="nav-link" href="MTiempo.html"><i class="fa-solid fa-users"></i> Usuarios</a></li>
        <li class="nav-item"><a class="nav-link active" href="MTipo.html"><i class="fa-solid fa-file-lines"></i> Tipos</a></li>
        <li class="nav-item"><a class="nav-link" href="Mtiempo.html"><i class="fa-solid fa-clock"></i> SLA</a></li>
    </ul>
    <div class="tarjeta-blanca shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="col-md-8">
                <h2 class="h5 fw-bold mb-1">Gestión de Tipos</h2>
                <p class="text-secondary small mb-0">Categorías de solicitudes ciudadanas</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-primary boton-agregar" data-bs-toggle="modal" data-bs-target="#modalTipo">
                    <i class="fa-solid fa-plus me-2"></i> Nuevo Tipo
                </button>
            </div>
        </div>

        <div class="buscar mb-4">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="campo-input" placeholder="Buscar...">
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr><th>Nombre del Tipo</th><th class="text-center">Estado</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                    <tr><td class="fw-medium">Felicitaciones</td><td class="text-center"><span class="etiqueta-activo">Activo</span></td><td class="text-end opciones-tabla"><i class="fa-solid fa-pencil icono-editar"></i><i class="fa-solid fa-trash-can icono-borrar"></i></td></tr><tr><td class="fw-medium">Reclamos</td><td class="text-center"><span class="etiqueta-activo">Activo</span></td><td class="text-end opciones-tabla"><i class="fa-solid fa-pencil icono-editar"></i><i class="fa-solid fa-trash-can icono-borrar"></i></td></tr><tr><td class="fw-medium">Sugerencias</td><td class="text-center"><span class="etiqueta-activo">Activo</span></td><td class="text-end opciones-tabla"><i class="fa-solid fa-pencil icono-editar"></i><i class="fa-solid fa-trash-can icono-borrar"></i></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
